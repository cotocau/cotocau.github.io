<style>
/* Layout: una mesa de juego a pantalla completa — marcador arriba, compañero enfrente, rivales a los lados, tapete granate al centro y tu mano abajo */
:root{
  --bg:#1b080d; --felt:#5a1b27; --felt-deep:#2b0a11; --panel:#2a0d14; --seat:#3a121b;
  --ink:#f4ead8; --ink-soft:#c8b29a; --line:rgba(244,234,216,.16);
  --gold:#e3b24f; --gold-ink:#2a1206; --rival:#e38f7c;
  --f-display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#app{height:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:7px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.score{display:flex;flex-direction:column;gap:3px;line-height:1;position:relative}
.score .plus{position:absolute;font:800 20px/1 var(--f-body);color:#5fd27c;text-shadow:0 2px 0 rgba(0,0,0,.5);pointer-events:none;animation:plusUp 1.6s ease-out both;white-space:nowrap}
@keyframes plusUp{0%{opacity:0;transform:translateY(8px) scale(.7)}15%{opacity:1;transform:translateY(0) scale(1.1)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.score.them{align-items:flex-end}
.lbl{font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.score b{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px}
.score b small{font:700 13px var(--f-body);letter-spacing:.02em}
.score.us b{color:var(--gold)} .score.them b{color:var(--rival)}
.mid{text-align:center}
.brand{font:800 24px/1 var(--f-display);letter-spacing:.05em}
.info{font-size:12px;color:var(--ink-soft);margin-top:3px;font-variant-numeric:tabular-nums}

.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.btn{font-weight:700;font-size:13px;background:rgba(244,234,216,.06);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--ink)}
.btn:hover{background:rgba(244,234,216,.12)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{border-color:var(--rival);color:var(--rival)}
.btn.sing{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-size:15px;padding:8px 18px;animation:glow 1.6s ease-in-out infinite}

.board{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.row{flex:1;min-height:0;display:grid;grid-template-columns:72px minmax(0,1fr) 72px;gap:6px}
.felt{position:relative;min-height:0;border-radius:20px;background:radial-gradient(ellipse at 50% 40%,var(--felt),var(--felt-deep) 78%);box-shadow:inset 0 0 0 1px rgba(227,178,79,.28),inset 0 0 0 7px rgba(0,0,0,.12),inset 0 0 50px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px 10px;overflow:hidden}
.felt::before{content:"";position:absolute;inset:7px;border-radius:14px;border:1px dashed rgba(227,178,79,.18);pointer-events:none}
.table{--cw:clamp(46px,calc(var(--vw,1vw)*13.5),64px);position:absolute;inset:10px}
.slot{position:absolute;width:var(--cw);height:calc(var(--cw)*1.5);transform:translate(-50%,-50%) rotate(var(--rot,0deg))}
.slot>.card,.slot>.stk{position:absolute;left:0;top:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:rgba(244,234,216,.4);font:500 14px var(--f-display);letter-spacing:.08em}
.fly{position:fixed;z-index:15;pointer-events:none;display:flex;left:0;top:0}
.fly .back+.back{margin-left:-30px}

.seat{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:13px;border-radius:14px;padding:4px 8px;transition:background .3s}
.seat.top{justify-content:center;min-height:52px}
.seat.side{flex-direction:column;justify-content:center;text-align:center;gap:5px;padding:6px 2px}
.seat.turn{background:rgba(227,178,79,.13);color:var(--ink)}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-display);background:var(--seat);border:1.5px solid var(--rival);color:var(--ink)}
.av.us{border-color:var(--gold)}
.seat.turn .av{box-shadow:0 0 0 4px rgba(227,178,79,.35)}
.who{display:flex;flex-direction:column;gap:1px;line-height:1.15}
.seat.side .who{align-items:center}
.nm{font-weight:700;color:var(--ink)}
.sub{font-size:11px;color:var(--ink-soft)}
.backs{display:flex;min-height:58px}
.back{flex:none;width:39px;height:58px;border-radius:5px;background:radial-gradient(circle at 50% 50%,#e3b24f 0 4px,transparent 4.5px),repeating-linear-gradient(45deg,#7d2333 0 5px,#5a1623 5px 10px);border:1.5px solid #e3b24f;box-shadow:inset 0 0 0 2px #5a1623,0 3px 6px rgba(0,0,0,.45)}
.deck-clasica .back{background:url(classic.webp) 0% 100% / 1000% 500% no-repeat;border:0;box-shadow:0 3px 6px rgba(0,0,0,.45)}
.back+.back{margin-left:-16px}
.seat.side .backs{flex-direction:column;align-items:center;min-height:0}
.seat.side .back{width:56px;height:38px;background-size:auto}
.deck-clasica .seat.side .back{background:url(classic.webp) 0% 100% / 1000% 500% no-repeat;width:38px;height:58px}
.seat.side .back+.back{margin-left:0;margin-top:-22px}
.deck-clasica .seat.side .back+.back{margin-top:-40px}
.bubble{font-size:11px;font-weight:800;color:var(--gold);min-height:14px;letter-spacing:.02em}
.dealer{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(227,178,79,.5);border-radius:999px;padding:1px 5px}

/* Cartas españolas dibujadas en SVG */
.card{--cw:56px;width:var(--cw);height:calc(var(--cw)*1.5);flex:none;border-radius:calc(var(--cw)*.1);position:relative;box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.38);transition:transform .25s,box-shadow .25s;user-select:none}
.card svg{display:block;width:100%;height:100%}
.card.cl{background:url(classic.webp) no-repeat;background-size:1000% 500%}
.pair{display:flex;align-items:flex-start;flex:none}
.pair .card+.card{margin-left:calc(var(--cw)*-.55);margin-top:calc(var(--cw)*.28)}
.chain .card.incoming{margin-top:calc(var(--cw)*.28)}
.card.incoming{animation:drop .45s ease-out}
.card.taking{transform:translateY(-6px) scale(1.05);box-shadow:0 0 0 3px var(--gold),0 10px 20px rgba(0,0,0,.45)}
.card.reserved{box-shadow:0 0 0 2px var(--felt-deep),0 0 0 4px var(--gold)}
.card.last{box-shadow:0 0 0 2px rgba(244,234,216,.6),0 6px 14px rgba(0,0,0,.38)}
.chain{display:flex;align-items:center;padding:12px 10px 8px;border:1.5px solid var(--gold);border-radius:12px;background:rgba(0,0,0,.22);position:relative}
.chain .card+.card{margin-left:calc(var(--cw)*-.55)}
.chain-lbl{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap}

.callout{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3}
.call{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 22px;border-radius:16px;background:rgba(27,8,13,.78);animation:pop var(--cd,1.6s) ease-out both;text-align:center}
.call b{font:800 clamp(30px,calc(var(--vw,1vw)*10),46px)/1 var(--f-display);color:var(--gold);text-shadow:0 3px 0 #2a0a10}
.call span{font-size:13px;font-weight:700;color:var(--ink)}

.narr{text-align:center;font-size:13.5px;color:var(--ink);min-height:20px;line-height:1.3}
.narr b{color:var(--gold)}
.you{display:flex;flex-direction:column;gap:6px;padding-bottom:2px}
.hand{display:flex;gap:12px;justify-content:center;min-height:calc(clamp(66px,calc(var(--vw,1vw)*20),86px)*1.5 + 26px)}
.hc{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border-radius:10px}
.hc .card{--cw:clamp(66px,calc(var(--vw,1vw)*20),86px)}
.hc:not(:disabled):hover .card{transform:translateY(-8px)}
.hc:disabled{cursor:default}
.hc:disabled .card{filter:saturate(.8) brightness(.88)}
/* ordenar las cartas a mano (8 nov): mantener el dedo y arrastrar */
.hand.ordmano{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hand.ordmano .hc:disabled{pointer-events:none}
.hand .hc.lifted{position:relative;z-index:5;transform:translateY(-14px)}
.hand .hc.lifted .card{box-shadow:0 0 0 3px var(--gold),0 12px 24px rgba(0,0,0,.55)}
.hint{font-size:11px;font-weight:800;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:rgba(244,234,216,.08);color:var(--ink-soft);white-space:nowrap}
.hint.cap{background:rgba(244,234,216,.18);color:var(--ink)}
.hint.big{background:var(--gold);color:var(--gold-ink)}
.status{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;min-height:24px;font-size:14px;color:var(--ink-soft)}
.status b{color:var(--ink)}
.status.mine b{color:var(--gold)}

.nit{border:1px solid rgba(227,178,79,.5);background:var(--panel);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:center}
.nit h3{margin:0;font:800 18px var(--f-display);color:var(--gold);letter-spacing:.04em}
.nit p{margin:0;font-size:14px}
.nit .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.overlay{position:fixed;inset:0;background:rgba(10,3,5,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-height:640px){.overlay{align-items:center}}
.panel{background:var(--panel);border:1px solid rgba(227,178,79,.35);border-radius:20px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font:800 26px/1.1 var(--f-display);text-wrap:balance}
.panel h3{margin:6px 0 0;font:800 16px var(--f-display);color:var(--gold);letter-spacing:.05em}
.panel p,.panel li{font-size:14.5px;max-width:65ch}
.panel p{margin:0}
.panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.panel .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.pts div{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.pts b{display:block;font:800 18px var(--f-display);color:var(--gold)}
.pts span{font-size:13px;color:var(--ink-soft)}
.sum{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.sum th,.sum td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
.sum th:first-child,.sum td:first-child{text-align:left;color:var(--ink-soft)}
.sum thead th{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.sum thead th.us{color:var(--gold)} .sum thead th.them{color:var(--rival)}
.sum tr.tot td{font-weight:800;color:var(--ink);border-bottom:0;font-size:16px}
.big-result{font:800 20px var(--f-display);text-align:center;color:var(--gold)}
.log{list-style:none;padding:0 !important;margin:0;display:flex;flex-direction:column;gap:2px !important;font-size:13.5px}
.log li{padding:4px 0;border-bottom:1px solid var(--line)}
.aliasin{width:100%;font:600 16px var(--f-body);color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.chips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center;align-self:center;max-width:100%}
.seat.side .chips{flex-direction:column;flex-wrap:nowrap;align-items:center;gap:2px}
.seat.side .chips .chip{font-size:11px;padding:0 4px}
.chip{display:inline-flex;align-items:baseline;gap:1px;font:800 12.5px var(--f-body);background:#f4ecdb;color:#2a1a10;border-radius:5px;padding:1px 5px;box-shadow:0 1px 2px rgba(0,0,0,.35);white-space:nowrap}
.chip i{font-style:normal;font-size:.8em;font-weight:900}
.chip.s0 i{color:#b8860b}.chip.s1 i{color:#c0392b}.chip.s2 i{color:#2c5d9e}.chip.s3 i{color:#2e7d32}
.chip.tr{outline:2px solid var(--gold)}
.lastfelt{position:relative;height:250px;border-radius:16px;background:radial-gradient(ellipse at center,#1f6b46,#0f3d27);margin:6px 0 10px;--cw:54px;overflow:hidden}
.lastfelt .ls{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;animation:lsIn .45s cubic-bezier(.2,.8,.3,1.2) both}
.lastfelt .ls small{font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);border-radius:999px;padding:0 7px}
.lastfelt .ls.win small{background:var(--gold);color:#2a1a10}
.lastfelt .ls.win .card{box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.45)}
@keyframes lsIn{from{opacity:0;left:50%;top:50%;transform:translate(-50%,-50%) scale(.4) rotate(-20deg)}}
.lastcap{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px 0;--cw:58px}.lastcap .card{--cw:58px}
.sum td.sumsc{position:relative}.sum td.sumsc .plus{position:absolute;right:6px;bottom:-12px;font:800 15px/1 var(--f-body);color:#5fd27c;animation:plusUp 1.6s ease-out both}
.prbadge{position:fixed;left:max(6px,env(safe-area-inset-left,0px));bottom:calc(4px + env(safe-area-inset-bottom,0px));z-index:40;background:#2e7d32;color:#fff;font:800 10px/1 var(--f-body);letter-spacing:.12em;padding:4px 7px;border-radius:999px;pointer-events:none;opacity:.9}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
.panel a{color:var(--gold)}
.lastinfo{text-align:center;font-weight:700}
.exp{width:100%;min-height:150px;font:12px ui-monospace,monospace;background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
.log li.hand{color:var(--gold);font-weight:700;padding-top:10px}
.co-slot{position:absolute;transform:translate(-50%,-50%);z-index:2}
.co-stock{position:absolute;left:50%;top:50%;width:var(--cw);height:calc(var(--cw)*1.5);transform:translate(-50%,-50%)}
.co-pinta{position:absolute;left:0;top:0;transform:translateX(52%) rotate(90deg);transform-origin:center}
.co-stock .back.big{transform:translateX(-22%)}
.co-count{margin-left:calc(var(--cw)*-.22)}
.co-pinta .card{--cw:inherit}
.co-stock .back.big{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)*1.5);border-radius:6px}
.co-count{position:absolute;left:calc(var(--cw)*.5);top:calc(var(--cw)*.75);transform:translate(-50%,-50%);background:rgba(27,8,13,.85);color:var(--gold);font-weight:800;font-size:12px;border-radius:999px;padding:1px 7px}
.co-trump{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;color:var(--ink-soft);background:rgba(0,0,0,.25);padding:3px 9px;border-radius:999px}
.co-trump b{color:var(--gold)}
.hand.co-hand{gap:4px;flex-wrap:nowrap}
.co-reveal{display:flex}
.co-reveal .card{--cw:40px}
.co-reveal .card+.card{margin-left:-10px}
.seat.side .co-reveal{flex-direction:column;align-items:center}
.seat.side .co-reveal .card+.card{margin-left:0;margin-top:-34px}
.hand.co-hand .hc .card{--cw:clamp(46px,calc(var(--vw,1vw)*14.5),80px)}
.seat.co .back+.back{margin-left:-20px}
.seat.side.co .back+.back{margin-left:0;margin-top:-46px}
.deck-clasica .seat.side.co .back+.back{margin-top:-48px}
.btn.playopt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 16px}
.btn.playopt b{font-size:17px}
.btn.playopt small{font-weight:500;font-size:12.5px;color:var(--ink-soft)}
.devtag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--rival);border:1px solid var(--rival);border-radius:999px;padding:1px 7px}
.contlbl{display:block;font-weight:500;font-size:12px;opacity:.85;margin-top:2px}
.pw{display:flex;gap:8px}
.pw input{flex:1;min-width:0;font:600 16px var(--f-body);color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.pwerr{color:var(--rival);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(0,0,0,.2)}
.tabs button{border:0;background:none;border-radius:999px;padding:7px 4px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
.tabs button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.draw{display:flex;justify-content:center;padding:6px 0}
.draw-card .card{--cw:90px;animation:flip 1.1s ease-out both}
@keyframes flip{0%{transform:rotateY(90deg) scale(.6);opacity:0}60%{transform:rotateY(0) scale(1.05);opacity:1}100%{transform:none}}
.menu{align-items:stretch;text-align:center}
.overlay.cover{background:radial-gradient(ellipse at 50% 30%,#5a1622 0%,#2a0a11 55%,#140407 100%);align-items:center}
.overlay.cover .panel{background:transparent;border:0;box-shadow:none;max-width:460px}
.overlay.cover .panel:not(.menu){background:rgba(20,5,9,.86);border:1px solid rgba(227,178,79,.35)}
.fan{position:relative;height:150px;margin:4px auto 0;width:260px}
.fan .fc{position:absolute;left:50%;bottom:0;transform-origin:50% 120%;--cw:74px}

<script>
// Mudanza a cotocau.github.io (2 nov 2026): la dirección antigua manda aquí los datos del móvil en «#mig=…» (no viaja a ningún servidor).
// Solo se importan en un móvil que todavía no tenga datos aquí, y nunca la clave del online (se crea una nueva).
(() => { try {
  const m = location.hash.match(/[#&]mig=([^&]+)/); if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  if (localStorage.getItem('cau.settings') || localStorage.getItem('cau.uid')) return;
  const d = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
  for (const k of ['cau.settings', 'app.v1', 'cau.v2', 'cau.queue']) if (typeof d[k] === 'string' && d[k].length < 500000) { JSON.parse(d[k]); localStorage.setItem(k, d[k]); }
  if (typeof d['cau.uid'] === 'string' && /^[a-z0-9]{4,40}$/.test(d['cau.uid'])) localStorage.setItem('cau.uid', d['cau.uid']);
} catch (e) {} })();
(() => {
'use strict';
/* ---------------- Motor del Cau ---------------- */
const RV = [1,2,3,4,5,6,7,10,11,12];
// Idioma: castellano (es) o valenciano (va). Los textos se escriben con L('castellano', 'valencià')
let LANG = 'es';
const L = (es, va) => LANG === 'va' ? va : es, T = (es, va) => LANG === 'va' ? va : es;   // T: donde ya hay una variable local L
const RN = [], RNA = [], RNP = [], SUITN = [], NAMES = ['Tú','Toni','Maria','Vicent'], TEAMN = [];
const fill = (a, v) => { a.splice(0, a.length, ...v); };
// Nombres que escribe la gente (propios o de otros jugadores): sin símbolos que puedan colar código en la pantalla, sin caracteres invisibles y con tope de largo
function cleanName(t, max = 14) { return String(t == null ? '' : t).replace(/[<>&"'`\\]/g, '').replace(/[\u0000-\u001f\u007f\u200b-\u200f\u2028-\u202e\u2066-\u2069\ufeff]/g, '').trim().slice(0, max); }
function applyLang(lang, names) {
  LANG = lang === 'va' ? 'va' : 'es';
  fill(RN, L(['As','2','3','4','5','6','7','Sota','Caballo','Rey'], ['As','2','3','4','5','6','7','Sota','Cavall','Rei']));
  fill(RNA, L(['el as','el 2','el 3','el 4','el 5','el 6','el 7','la sota','el caballo','el rey'], ["l'as",'el 2','el 3','el 4','el 5','el 6','el 7','la sota','el cavall','el rei']));
  fill(RNP, L(['ases','doses','treses','cuatros','cincos','seises','sietes','sotas','caballos','reyes'], ['asos','dosos','tresos','quatres','cincs','sisos','setes','sotes','cavalls','reis']));
  fill(SUITN, L(['oros','copas','espadas','bastos'], ['oros','copes','espases','bastos']));
  fill(TEAMN, L(['Nosotros','Ellos'], ['Nosaltres','Ells']));
  NAMES[0] = L('Tú', 'Tu');
  if (names) for (let i = 0; i < 3; i++) NAMES[i + 1] = cleanName(names[i] || ['Toni','Maria','Vicent'][i]) || ['Toni','Maria','Vicent'][i];
}
applyLang('es');
const ofSuit = s => LANG === 'va' ? (s === 0 || s === 2 ? "d'" : 'de ') + SUITN[s] : 'de ' + SUITN[s];
const apunt = (t, n) => L(`${TEAMN[t]} se apuntan ${n} de nit.`, `${TEAMN[t]} s'apunten ${n} de nit.`);
const TARGET = 40;
const team = p => p % 2;
const ALL = []; for (let s = 0; s < 4; s++) for (let r = 0; r < 10; r++) ALL.push({ id: s*10 + r, r, s });
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));
const cloneLite = o => { const { log, feed, rec, prevRec, ...rest } = o; const c = JSON.parse(JSON.stringify(rest)); c.log = []; c.feed = []; return c; };
const cardName = c => `${RNA[c.r]} ${ofSuit(c.s)}`;
const emptyBon = () => ({ bac:0, rebac:0, sv:0, limpia:0, nit:0, pixat:0 });
const bonSum = b => b.bac + b.rebac + b.sv + b.limpia + b.nit + (b.pixat || 0);
const scoreTxt = s => s < 20 ? [s, s === 1 ? 'mala' : L('malas', 'males')] : [s - 20, s - 20 === 1 ? L('buena', 'bona') : L('buenas', 'bones')];

// notación corta para el registro: número + palo (o oros, c copas, e espadas, b bastos)
const cn = c => `${RV[c.r]}${'oceb'[c.s]}`;
const SEATC = ['Tú', 'D', 'C', 'I'];
function say(S, txt, k) { if (S.rec) S.rec.lines.push(txt); S.log.push({ txt, k: k || '' }); if (S.log.length > 500) S.log.splice(0, S.log.length - 500); S.feed.push({ txt, k: k || '' }); }

// Puntos aún en el aire: un bac o un rebac (y su limpia) se pueden perder si el siguiente lo mata,
// así que no cuentan para llegar a 40 hasta que se cierra la cadena (regla confirmada el 4 nov)
function chainPend(S, t) {
  const ch = S.chain; if (!ch || team(ch.owner) !== t) return 0;
  const n = ch.cards.length; return (n === 2 ? 2 : n === 3 ? 3 : 0) + (n < 4 && ch.limpia ? 1 : 0);
}
function winNow(S, t) {
  S.over = true; S.winner = t; S.phase = 'gameEnd'; S.endMid = true;
  say(S, L(`${TEAMN[t]} llegan a 40: ¡fin de la partida!`, `${TEAMN[t]} arriben a 40: final de la partida!`), 'pts');
}
function addPts(S, t, k, n) {
  S.bon[t][k] += n; S.score[t] += n;
  if (!S.over && n > 0 && S.score[t] - chainPend(S, t) >= TARGET) winNow(S, t);
}
// al cerrarse una cadena (nadie la mata), sus puntos ya son seguros: puede que ahora alguien llegue a 40
function checkWin(S) {
  if (S.over) return;
  const ok = [0, 1].filter(t => S.score[t] - chainPend(S, t) >= TARGET);
  if (ok.length) winNow(S, ok.length === 2 ? (S.score[0] >= S.score[1] ? 0 : 1) : ok[0]);
}

function newGame() {
  const S = { score:[0,0], dealer: Math.floor(Math.random()*4), handNo:0, log:[], feed:[], over:false, winner:null };
  newHand(S);
  return S;
}

function newHand(S) {
  S.handNo++;
  S.deck = shuffle(ALL.map(c => ({ ...c })));
  S.table = []; S.slots = {}; S.hands = [[],[],[],[]]; S.chain = null; S.lastPlay = null;
  S.cap = [0,0]; S.bon = [emptyBon(), emptyBon()]; S.public = []; S.lastCapturer = null; S.lastCap = null;
  S.round = 0; S.bet = null; S.summary = null; S.duels = []; S.duelNotes = []; S.endMid = false; S.bubbles = ['','','',''];
  S.turn = (S.dealer + 1) % 4;

  try { const f = `voz/${vozNum(n)}/${k}.mp3`, a = vozCache[f] || (vozCache[f] = new Audio(f)); a.currentTime = 0; a.play().catch(() => {}); } catch (e) {}
}
// k = frase, p = asiento de quien la dice (0 = tú)
function voz(k, p) {
  if (!VOZ_KEYS.includes(k)) return;
  p = [0, 1, 2, 3].includes(p) ? p : 0; const n = seatVoices()[p];
  if (NET && NET.role === 'host' && NET.started) netEv({ k: 'voz', v: k, p, n });
  vozPlay(k, n);
}

// Sonidos de cartas (6 nov), hechos con ruido filtrado: tapete = echar carta; recoger = llevarse cartas (Cau) o la baza (Coto);
// roce + toque = repartir y robar
// (el roce mientras vuela la carta y el toque al llegar). Cada golpe cambia un poco de tono y fuerza.
const DEAL_MS = 368;   // el reparto va siempre al ritmo del modo lento (el del sonido)
let sctx = null; const sbuf = {};
function sfxInit() {
  if (sctx) { if (sctx.state === 'suspended') sctx.resume().catch(() => {}); return; }
  try { sctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  for (const k of ['tapete', 'roce', 'toque', 'recoger']) fetch(`sfx/${k}.mp3`).then(r => r.arrayBuffer()).then(b => sctx.decodeAudioData(b)).then(d => { sbuf[k] = d; }).catch(() => {});
}
addEventListener('pointerdown', sfxInit, { passive: true }); addEventListener('keydown', sfxInit);
function sfx(k, delay = 0, vol = 1) {
  if (SETTINGS.sonidos === false || !sctx || !sbuf[k] || document.hidden) return;
  try {
    const s = sctx.createBufferSource(), g = sctx.createGain(); s.buffer = sbuf[k];
    s.playbackRate.value = 0.93 + Math.random() * 0.14; g.gain.value = 0.6 * vol * (0.75 + Math.random() * 0.25);
    s.connect(g); g.connect(sctx.destination); s.start(sctx.currentTime + delay);
  } catch (e) {}
}
const sfxDeal = ms => { sfx('roce', 0, 0.8); sfx('toque', ms * 0.92 / 1000, 0.8); };
const SFX_NET = { tap: 'tapete', rec: 'recoger' };
const sfxNet = k => { sfx(SFX_NET[k], 0, k === 'rec' ? 0.9 : 1); netEv({ k: 'sfx', s: k }); };   // el invitado lo oye también
const sfxTap = () => sfxNet('tap');

let calloutTimer = null;
const escH = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
async function callout(txt, sub, wait = true) {
  if (NET && NET.role === 'host' && NET.started) netEv({ k: 'callout', txt, sub });
  const el = $('callout'); const d = 1700 * SPEEDS[speedIx][1];
  el.innerHTML = `<div class="call" style="--cd:${d}ms"><b>${escH(txt)}</b>${sub ? `<span>${escH(sub)}</span>` : ''}</div>`;
  clearTimeout(calloutTimer); calloutTimer = setTimeout(() => { el.innerHTML = ''; }, d);
  if (wait) await sleep(1500);
}

async function drainFeed(untilDeal) {
  // con untilDeal se muestra solo lo ocurrido antes del nuevo reparto (p. ej. el de nit que se descubre)
  let n = S.feed.length;
  if (untilDeal) { const k = S.feed.findIndex(i => i.k === 'hand'); if (k >= 0) n = k + 1; }
  const items = S.feed.splice(0, n);
  for (const i of items) if (i.duel) { DUELH.pts[i.duel.w] += i.duel.pts; DUELH.n++; }   // se guardan hasta su aviso
  for (const i of items) {
    if (i.k === 'sing') { narr = i.txt; render(); voz(i.v2 || 'denit', i.p); await callout('De nit', /^(Cantas|Vuelves|Cantes|Tornes)/.test(i.txt) ? NAMES[0] : i.txt.split(' ')[0]); }
    else if (i.k === 'nit' || i.k === 'pts') { narr = i.txt; render(); if (i.v) voz(i.v, i.p); await sleep(1100); }
    else if (i.k === 'duel') {
      const d = i.duel || { w: 0, pts: 0 };
      narr = i.txt; render();
      await callout(L('De nit', 'De nit'), d.falta ? L(`Ganan ${TEAMN[d.w]} la partida`, `Guanyen ${TEAMN[d.w]} la partida`) : `${L('Ganan', 'Guanyen')} ${TEAMN[d.w]} · +${d.pts}`);
      DUELH.pts[d.w] -= d.pts; DUELH.n--; render(); await sleep(900);   // ahora sube el marcador
    }
  }
  DUELH.pts = [0, 0]; DUELH.n = 0;
}

async function doPlay(p, cid) {
  const tutD = TUTG && TUTG.cau && S.round === 1 ? 13 - S.hands.reduce((a, h) => a + h.length, 0) : 0;   // jugada nº tutD del primer reparto guiado
  const sim = clone(S); sim.feed = [];
  const res = applyPlay(sim, p, cid);
  const special = res.ev.find(e => ['bac','rebac','sv','limpia'].includes(e.k));
  // 1) la carta cae en la mesa
  const slot = sim.slots[res.card.id] && sim.table.some(c => c.id === res.card.id) ? sim.slots[res.card.id] : null;
  fx = { card: res.card, take: [], p, slot };
  S.bubbles[p] = '';
  narr = `<b>${NAMES[p]}</b> ${p === 0 ? L('juegas', 'jugues') : L('juega', 'juga')} ${cardName(res.card)}.`;
  render(); sfxTap();
  await sleep(900);
  // 2) se marcan las cartas que se lleva
  const cap = res.ev.find(e => e.k === 'cap'), cobra = res.ev.find(e => e.k === 'cobra');
  if (res.take.length || special) {
    const glow = special && ['bac','rebac','sv'].includes(special.k) && sim.chain ? sim.chain.cards.map(c => c.id) : [];
    fx = { card: res.card, take: res.take, p, slot, glow };
    const who = special ? special.p : p;
    narr = `${cobra ? cobra.txt + '. ' : ''}${special ? `<b>${NAMES[who]}</b>: <b>${special.txt}</b> +${special.pts}` : cap ? `<b>${NAMES[p]}</b> ${L(`captura ${cap.n} cartas.`, `arreplega ${cap.n} cartes.`)}` : ''}`;
    render();
    if (special) voz(special.k === 'bac' && /Limpia/.test(special.txt) ? 'baclimpia' : special.k, special.p);
    if (special) await callout(special.txt,`${NAMES[who]} · +${special.pts}`);
    else await sleep(1100);
  } else await sleep(300);
  fx = null; if (res.take.length) sfxNet('rec');   // se lleva las cartas de la mesa
  sim.bubbles[p] = cap ? cap.txt : '';
  if (special) sim.bubbles[special.p] = special.txt.replace(/[¡!]/g, '');
  say(sim, `${p === 0 ? L('Juegas', 'Jugues') : NAMES[p] + L(' juega', ' juga')} ${cardName(res.card)} — ${res.ev.map(e => e.txt).join(' · ')}.`);
  const roundBefore = sim.round;
  afterPlay(sim);
  if (sim.round !== roundBefore && sim.phase !== 'handEnd') sim.bubbles = sim.bubbles.map((b, i) => sim.sung && sim.sung[i] ? b : '');
  S = sim;
  if (tutD) { render(); await tutPause(tutCauAfter(tutD)); }
  if (S.round !== roundBefore && S.phase !== 'handEnd' && S.phase !== 'gameEnd') {
    // las cartas nuevas no se ven hasta que llegan volando
    dealView = { n: [0, 0, 0, 0], table: true, tableIds: new Set(), temp: null };
    render(); await drainFeed(true);
    narr = L(`Reparto ${S.round} de 3.`, `Repartiment ${S.round} de 3.`);
    await animateDeal(false);
    if (S.round === 3) voz('acabat', S.dealer);   // ya se ha repartido todo el mazo: lo dice quien reparte
    if (TUTG && TUTG.cau) await tutPause(S.round === 2 ? L('<b>Segundo reparto:</b> 3 cartas más a cada uno. La mesa sigue como estaba, y en cada mano hay 3 repartos.', '<b>Segon repartiment:</b> 3 cartes més a cadascú. El tapet continua com estava, i en cada mà hi ha 3 repartiments.') : L('<b>Último reparto.</b> Aquí todos los que tienen pareja cantan de nit al principio. Al acabar, quien capturó el último se lleva lo que queda en la mesa, y cada pareja suma un punto por cada carta por encima de 20.', '<b>Últim repartiment.</b> Ací tots els que tenen parella canten de nit al principi. En acabar, qui va arreplegar l\'últim s\'endú el que queda al tapet, i cada parella suma un punt per cada carta per damunt de 20.'));
  }
  render();
  await drainFeed();
}

// Animación de reparto: los paquetes de 3 cartas salen de quien reparte hacia cada jugador
async function animateDeal(withTable) {
  const seq = S.dealSeq || [];
  dealView = { n: [0,0,0,0], table: !withTable, tableIds: new Set(), temp: null };
  render();
  await sleep(450);
  const center = el => { const r = bcr(el); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const src = S.dealer === 0 ? $('hand') : ($('seat' + S.dealer).querySelector('.av') || $('seat' + S.dealer));
  const [ox, oy] = center(src);
  const slotXY = sl => { const r = bcr($('table')); const [x, y] = SLOTPOS[sl.i]; return [r.left + r.width * (x + sl.dx) / 100, r.top + r.height * (y + sl.dy) / 100]; };
  const fly = async (from, to) => {
    if (reduce) return;
    const f = document.createElement('div'); f.className = 'fly'; f.innerHTML = '<span class="back"></span>'; document.body.appendChild(f);
    const w = f.offsetWidth / 2, h = f.offsetHeight / 2;
    const a = f.animate([{ transform: `translate(${from[0] - w}px,${from[1] - h}px) scale(.75)` }, { transform: `translate(${to[0] - w}px,${to[1] - h}px) scale(1)` }], { duration: DEAL_MS, easing: 'cubic-bezier(.3,.7,.3,1)' });
    sfxDeal(DEAL_MS);
    await a.finished.catch(() => {}); f.remove();
  };
  const gen = GEN;
  for (const st of seq) {
    if (gen !== GEN || isCoto()) return;
    if (st.to === 'T') {
      netEv({ k: 'cfly', from: S.dealer, p: 'T', slot: st.slot });
      await fly([ox, oy], slotXY(st.slot));
      if (gen !== GEN || !dealView) return;
      if (st.pixat) {
        dealView.temp = { card: st.card, slot: st.slot }; renderTable();
        narr = L(`<b>S'ha pixat:</b> ${RNA[st.card.r]} ya estaba en el tapete. Se aparta y volverá al mazo al acabar de repartir.`, `<b>S'ha pixat:</b> ${RNA[st.card.r]} ja estava al tapet. S'aparta i tornarà a la baralla en acabar de repartir.`); $('narr').innerHTML = narr;
        await callout("S'ha pixat", SETTINGS.socarrat ? `${TEAMN[1 - team(S.dealer)]} · +1` : `${RN[st.card.r]} ${L('repetido', 'repetit')}`);
        dealView.temp = null; renderTable();
        netEv({ k: 'cfly', from: 'T', slot: st.slot, p: S.dealer });
        await fly(slotXY(st.slot), [ox, oy]);
      } else { dealView.tableIds.add(st.card.id); renderTable(); }
    } else {
      const p = st.to;
      netEv({ k: 'cfly', from: S.dealer, p });
      await fly([ox, oy], center(p === 0 ? $('hand') : ($('seat' + p).querySelector('.backs') || $('seat' + p))));
      if (gen !== GEN || !dealView) return;
      dealView.n[p]++; p === 0 ? renderHand() : renderSeat(p);
    }
  }
  dealView = null; render();
  await sleep(700);
}
async function beginHand() {
  dealView = { n: [0,0,0,0], table: false, tableIds: new Set(), temp: null };
  busy = true; const gen = GEN;
  const tut = TUTG && TUTG.cau && !TUTG.intro;
  try {
    if (tut) { TUTG.intro = true; for (const t of tutCauIntro(0)) await tutPause(t); if (gen !== GEN) return; }
    await animateDeal(true); await drainFeed();
    if (tut && gen === GEN) for (const t of tutCauIntro(1)) await tutPause(t);
  } finally { if (gen === GEN) busy = false; }
  if (gen !== GEN) return;
  render(); loop();
}

async function loop() {
  if (isCoto()) return cotoLoop();
  if (busy) return; busy = true; const gen = GEN;
  try {
    while ((!S.over || S.phase === 'play') && gen === GEN && !isCoto()) {
      while (!$('overlay').hidden && !['handEnd','gameEnd'].includes(S.phase)) await new Promise(r => setTimeout(r, 200));
      save();
      if (S.over) break;
      if (S.phase === 'play') {
        if (humanSeat(S.turn)) break;
        render();
        await sleep(700);
        if (botSing(S, S.turn)) { render(); await drainFeed(); continue; }
        await sleep(500);
        const forcedC = TUTG && TUTG.cau ? tutCauWant() : null;
        await doPlay(S.turn, forcedC != null ? forcedC : botChoose(S, S.turn));
      } else if (S.phase === 'nit') {
        if (humanSpeaks(S) || cauSpeaker(S) != null) break;
        render();
        await sleep(1200);
        botBet(S); render(); await drainFeed();
      } else break;
    }
  } finally { if (gen === GEN) { busy = false; save(); render(); } }
}

function showPanel(html) { $('panel').classList.remove('menu'); $('overlay').classList.remove('cover'); $('panel').innerHTML = html; $('overlay').hidden = false; const f = $('panel').querySelector('button'); if (f) f.focus(); }
function closePanel() { $('overlay').hidden = true; $('overlay').classList.remove('cover'); }

const winTitle = () => S.winner === 0 ? L('¡Habéis ganado la partida!', 'Heu guanyat la partida!') : L('Han ganado la partida ellos', 'Han guanyat la partida ells');
function scoreLine(i) { const [n, w] = scoreTxt(S.score[i]); return `${n} ${w}`; }

function showSummary() {
  if (TUTG && TUTG.cau) return showGuidedCauEnd();
  const guest = NET && NET.role === 'guest';
  const gwait = netGuestWait(), gacts = '';
  shareRec(S.rec, 'cau', { score: S.score.slice(), over: !!S.over, winner: S.over ? S.winner : null, falta: !!S.endFalta, mid: !!S.endMid });
  if (S.phase === 'gameEnd') {
    if (!guest && !S.caueSaid) { S.caueSaid = true; voz('caues', S.winner === 0 ? 0 : 1); }   // «El cau és nostre!»
    const why = S.endFalta ? L('Se la han jugado en el de nit.', "S'ho han jugat en el de nit.") : L('Han llegado a 40 durante la mano.', 'Han arribat a 40 durant la mà.');
    showPanel(`<h2>${winTitle()}</h2><p class="big-result">${why}</p><p style="text-align:center">${TEAMN[0]} ${scoreLine(0)} · ${TEAMN[1]} ${scoreLine(1)}</p>${guest ? (NET.match ? gwait : netEndWait()) : ''}${netRxBar()}<div class="acts">${guest ? gacts : APP.mode === 'cotocau' ? `<button class="btn primary" type="button" data-act="match">${L('Continuar', 'Continuar')}</button>` : NET ? netEndActs() : `<button class="btn" type="button" data-act="menu">${L('Salir al menú', 'Eixir al menú')}</button><button class="btn primary" type="button" data-act="newgame">${L('Nueva partida', 'Partida nova')}</button>`}</div>`);
    return;
  }
  const R = S.summary; if (!R) return;
  const row = (l, k) => `<tr><td>${l}</td><td>${R[0][k]}</td><td>${R[1][k]}</td></tr>`;
  const held = cauHeld(), before = i => S.score[i] - (held ? R[i].cardPts : 0);
  const scoreLine0 = i => { const [n, w] = scoreTxt(before(i)); return `${n} ${w}`; };
  const title = S.over ? winTitle() : L(`Fin de la mano ${S.handNo}`, `Final de la mà ${S.handNo}`);
  showPanel(`<h2>${title}</h2>
  <table class="sum"><thead><tr><th></th><th class="us">${TEAMN[0]}</th><th class="them">${TEAMN[1]}</th></tr></thead><tbody>
  ${row(L('Cartas', 'Cartes'), 'cards')}${row(L('Puntos por cartas (más de 20)', 'Punts per cartes (més de 20)'), 'cardPts')}${row('Bac', 'bac')}${row('Rebac', 'rebac')}${row('Sant Vicent', 'sv')}${row('Limpia', 'limpia')}${row('De nit', 'nit')}${(R[0].pixat || R[1].pixat) ? row("S'ha pixat", 'pixat') : ''}
  <tr class="tot"><td>${L('Total de la mano', 'Total de la mà')}</td><td>${R[0].total}</td><td>${R[1].total}</td></tr>
  <tr class="tot"><td>Marcador</td><td class="sumsc" id="sumsc0"><span>${scoreLine0(0)}</span></td><td class="sumsc" id="sumsc1"><span>${scoreLine0(1)}</span></td></tr></tbody></table>
  ${(S.duelNotes || []).map(t => `<p>${t}</p>`).join('')}
  ${guest ? (S.over && !NET.match ? netEndWait() : gwait) : ''}${netRxBar()}<div class="acts">${guest ? gacts : S.over ? (APP.mode === 'cotocau' ? `<button class="btn primary" type="button" data-act="match">${L('Continuar', 'Continuar')}</button>` : NET ? netEndActs() : `<button class="btn" type="button" data-act="menu">${L('Salir al menú', 'Eixir al menú')}</button><button class="btn primary" type="button" data-act="newgame">${L('Nueva partida', 'Partida nova')}</button>`) : `<button class="btn primary" type="button" data-act="nexthand">${L('Siguiente mano', 'Mà següent')}</button>`}</div>`);
  if (held) {
    const key = S.handNo + ':' + S.score.join(','), sc = S.score.slice(), from = [before(0), before(1)];
    setTimeout(() => {
      if (!S || S.handNo + ':' + S.score.join(',') !== key) return;
      cauSumKey = key; renderScore(0); renderScore(1);
      for (const t of [0, 1]) countCell($('sumsc' + t), from[t], sc[t], scoreTxt);
    }, 700);
  }
}

function rulesCoto() {
  return L(`<h2>Reglas del Coto</h2>
  <p>El guiñote de Alcoy: cuatro jugadores en dos parejas, baraja española de 40 cartas. Se juega hacia la derecha.</p>
  <h3>Cartas</h3><ul><li>Orden de fuerza: as, tres, rey, sota, caballo, 7, 6, 5, 4, 2.</li><li>Puntos: as 11, tres 10, rey 4, sota 3, caballo 2; el resto, 0. Con las 10 de últimas hay 130 puntos por mano.</li><li>Cualquier triunfo gana a cualquier carta de otro palo. Si no hay triunfo, gana la más alta del palo de salida.</li></ul>
  <h3>Reparto</h3><ul><li>6 cartas a cada uno, de una en una. La siguiente se deja boca arriba bajo el montón: es la pinta y marca el triunfo.</li><li>Reparte quien hizo las 10 de últimas en la mano anterior. Sale el de su derecha.</li></ul>
  <h3>Mientras queda montón</h3><ul><li>Tirada libre: no hay que asistir ni matar.</li><li>Después de cada baza roban todos, empezando por quien la ha ganado, que sale en la siguiente.</li><li><b>Cantes:</b> rey y sota del mismo palo. Las 40 si es de triunfo, las 20 si no. Se canta cuando tu pareja acaba de ganar una baza, antes de salir a la siguiente; se pueden cantar varios a la vez y también es opcional.</li><li><b>Cambiar el 7:</b> si la pinta es figura, tres o as, quien tenga el 7 de triunfo la puede cambiar mientras quede montón. Como los cantes, solo justo después de que su pareja gane una baza, antes de salir a la siguiente, le toque o no. En la última baza con montón, si la gana su pareja, se cambia solo.</li></ul>
  <h3>Arrastre (sin montón)</h3><ul><li>Siempre hay que seguir el palo.</li><li>Si va ganando un rival: hay que superarle si se puede. Sin el palo, hay que matar con triunfo, y si ya hay un triunfo, echar uno más alto si se tiene.</li><li>Si va ganando tu compañero: cualquier carta del palo; sin el palo, carta libre.</li></ul>
  <h3>Partida y coto</h3><ul><li>Se gana con 101 puntos: las 50 primeras son malas y a partir de ahí, buenas (51 buenas).</li><li>Si al acabar la mano las dos parejas pasan de 50 buenas, gana la que hizo las 10 de últimas.</li><li>Si nadie llega, se juega otra mano de vueltas sumando, y la partida acaba en el momento en que una pareja llega a 101 (con bazas o cantes): «se sale».</li><li>El coto se juega al mejor de 5 partidas (o de 3, en Ajustes).</li></ul>`,
  `<h2>Regles del Coto</h2>
  <p>El guinyot d'Alcoi: quatre jugadors en dues parelles, baralla espanyola de 40 cartes. Es juga cap a la dreta.</p>
  <h3>Cartes</h3><ul><li>Ordre de força: as, tres, rei, sota, cavall, 7, 6, 5, 4, 2.</li><li>Punts: as 11, tres 10, rei 4, sota 3, cavall 2; la resta, 0. Amb les 10 d'últimes hi ha 130 punts per mà.</li><li>Qualsevol triomf guanya a qualsevol carta d'un altre pal. Si no hi ha triomf, guanya la més alta del pal d'eixida.</li></ul>
  <h3>Repartiment</h3><ul><li>6 cartes a cadascú, d'una en una. La següent es deixa cap per amunt davall del munt: és la pinta i marca el triomf.</li><li>Reparteix qui va fer les 10 d'últimes en la mà anterior. Ix el de la seua dreta.</li></ul>
  <h3>Mentre queda munt</h3><ul><li>Tirada lliure: no cal assistir ni matar.</li><li>Després de cada basa roben tots, començant per qui l'ha guanyada, que ix en la següent.</li><li><b>Cants:</b> rei i sota del mateix pal. Les 40 si és de triomf, les 20 si no. Es canta quan la teua parella acaba de guanyar una basa, abans d'eixir a la següent; se'n poden cantar diversos alhora i també és opcional.</li><li><b>Canviar el 7:</b> si la pinta és figura, tres o as, qui tinga el 7 de triomf la pot canviar mentre quede munt. Com els cants, només just després que la seua parella guanye una basa, abans d'eixir a la següent, li toque o no. En l'última basa amb munt, si la guanya la seua parella, es canvia sola.</li></ul>
  <h3>Arrossegament (sense munt)</h3><ul><li>Sempre cal seguir el pal.</li><li>Si guanya un rival: cal superar-lo si es pot. Sense el pal, cal matar amb triomf, i si ja hi ha un triomf, tirar-ne un de més alt si se'n té.</li><li>Si guanya el teu company: qualsevol carta del pal; sense el pal, carta lliure.</li></ul>

const NET_SAFE_CH = { '<': '‹', '>': '›', '&': '+', '"': '”', "'": '’', '`': '´' };
function netSafe(v, d = 0) {

  const tot = L(`${r.pts} puntos para ${us ? 'vosotros' : 'ellos'}`, `${r.pts} punts per a ${us ? 'vosaltres' : 'ells'}`) + (r.last ? L(' (con las 10 de últimas)', " (amb les 10 d'últimes)") : '');
  if (k === 0) return L(`${N[3]} echa el 2 de copas. La baza es de <b>${N[2]}</b>: su 3 es la carta más alta del palo que ha salido. Se lleva las cuatro cartas: <b>${tot}</b>.`, `${N[3]} tira el 2 de copes. La basa és de <b>${N[2]}</b>: el seu 3 és la carta més alta del pal que ha eixit. S'endú les quatre cartes: <b>${tot}</b>.`);
  if (k === 1) return L(`${N[1]} echa el 4 de bastos. ¡La baza es <b>tuya</b>! Tu 2 de oros es triunfo y gana al as de bastos, aunque valga mucho menos: <b>${tot}</b>.`, `${N[1]} tira el 4 de bastos. La basa és <b>teua</b>! El teu 2 d'oros és triomf i guanya l'as de bastos, encara que valga molt menys: <b>${tot}</b>.`);
  if (k === 2) return L(`${N[3]} echa el <b>rey de copas</b>: como la baza ya era de su pareja, le <b>carga</b> puntos. Gana ${N[1]}: <b>${tot}</b>.`, `${N[3]} tira el <b>rei de copes</b>: com que la basa ja era de la seua parella, li <b>carrega</b> punts. Guanya ${N[1]}: <b>${tot}</b>.`);
  if (k === 3) return L(`Gana ${N[2]} con el triunfo y se lleva tu 3 de espadas: <b>${tot}</b>. Cargar puntos en la baza de tu pareja es de lo mejor que se puede hacer.`, `Guanya ${N[2]} amb el triomf i s'endú el teu 3 d'espases: <b>${tot}</b>. Carregar punts en la basa de la teua parella és del millor que es pot fer.`);
  return w === 0 ? L(`Ganas tú la baza: <b>${tot}</b>.`, `Guanyes tu la basa: <b>${tot}</b>.`) : L(`Gana ${N[w]} la baza: <b>${tot}</b>.`, `Guanya ${N[w]} la basa: <b>${tot}</b>.`);
}
function tutCotoDrawn(k) {
  if (k === 0) return L('Después de cada baza todos <b>roban</b> una carta del montón, empezando por quien la ha ganado. Así cada uno sigue con 6 cartas.<br>Mientras quede montón puedes echar <b>la carta que quieras</b>: no hace falta seguir el palo.', 'Després de cada basa tots <b>roben</b> una carta del munt, començant per qui l\'ha guanyada. Així cadascú continua amb 6 cartes.<br>Mentre quede munt pots tirar <b>la carta que vulgues</b>: no cal seguir el pal.');
  if (k === 3) return L('Se ha acabado el montón (el último en robar se lleva la pinta) y empieza el <b>arrastre</b>. Ahora cambian las normas:<br>• Hay que <b>seguir el palo</b> siempre.<br>• Si gana un rival, hay que <b>superarle</b> si se puede; si no tienes del palo, hay que <b>matar con triunfo</b>.<br>• Si gana tu pareja, basta con echar del palo.<br>Las cartas que no puedes jugar salen apagadas.', 'S\'ha acabat el munt (l\'últim que roba s\'endú la pinta) i comença l\'<b>arrossegament</b>. Ara canvien les normes:<br>• Cal <b>seguir el pal</b> sempre.<br>• Si guanya un rival, cal <b>superar-lo</b> si es pot; si no tens del pal, cal <b>matar amb triomf</b>.<br>• Si guanya la teua parella, n\'hi ha prou amb tirar del pal.<br>Les cartes que no pots jugar ixen apagades.');
  return null;
}
function tutCoach() {
  if (!TUTG) return '';
  if (TUTG.pause) return tutPauseHTML();
  TUTG.trickNo = G.trickNo;
  const N = NAMES, k = G.trickNo, t = G.trick.length, me = G.turn === 0 && G.phase === 'play' && !busy;
  if (coDealView) return L(`Reparte ${N[3]}: 6 cartas a cada uno…`, `Reparteix ${N[3]}: 6 cartes a cadascú…`);
  if (G.phase !== 'play') return L('Fin de la mano.', 'Final de la mà.');
  if (k === 0) return me ? L(`Sales tú. Mientras queda montón puedes echar lo que quieras. Para empezar, echa una carta baja que no vale puntos, el <b>4 de copas</b>: así no arriesgas nada.`, `Ixes tu. Mentre queda munt pots tirar el que vulgues. Per a començar, tira una carta baixa que no val punts, el <b>4 de copes</b>: així no arrisques res.`)
    : L('Juegan los demás…', 'Juguen els altres…');
  if (k === 1 && !t && coCantesFor(G, 0).length) return L(`Tu pareja ha ganado la baza, y justo ahora, antes de que salga la siguiente, se puede <b>cantar</b>.<br>Tienes <b>rey y sota de espadas</b>: es un cante de <b>20</b>. Si fueran de triunfo (oros) serían <b>las 40</b>. En una mano puede haber hasta tres cantes de 20 (uno por palo) y uno de 40.<br>Pulsa <b>Cantar 20 en espadas</b>.`, `La teua parella ha guanyat la basa, i just ara, abans que isca la següent, es pot <b>cantar</b>.<br>Tens <b>rei i sota d'espases</b>: és un cant de <b>20</b>. Si foren de triomf (oros) serien <b>les 40</b>. En una mà pot haver-hi fins a tres cants de 20 (un per pal) i un de 40.<br>Prem <b>Cantar 20 en espases</b>.`);
  if (k === 1 && !t && coCanSwap(G, 0)) return L(`¡20 puntos más! Ahora el <b>7 de triunfo</b>: quien lo tiene puede cambiarlo por la pinta si es buena (figura, tres o as), como los cantes: justo después de que gane una baza su pareja.<br>Tienes el 7 de oros y la pinta es el rey de oros: pulsa <b>Cambiar el 7</b>.`, `20 punts més! Ara el <b>7 de triomf</b>: qui el té pot canviar-lo per la pinta si és bona (figura, tres o as), com els cants: just després que guanye una basa la seua parella.<br>Tens el 7 d'oros i la pinta és el rei d'oros: prem <b>Canviar el 7</b>.`);
  if (k === 1) return me ? L(`${N[3]} ha echado el <b>as de bastos</b> (11 puntos). Tú no tienes bastos, pero tienes triunfos: puedes <b>matar con triunfo</b>. El <b>2 de oros</b> gana a cualquier carta de otro palo. ¡Échalo!`, `${N[3]} ha tirat l'<b>as de bastos</b> (11 punts). Tu no tens bastos, però tens triomfs: pots <b>matar amb triomf</b>. El <b>2 d'oros</b> guanya a qualsevol carta d'un altre pal. Tira'l!`)
    : L('Juegan los demás…', 'Juguen els altres…');
  if (k === 2) return me ? L(`Has ganado la baza, así que sales tú.<br><b>Consejo:</b> al salir, interesa irte de un palo que tu pareja <b>no tenga</b>, porque así podrá matar con triunfo. Todavía no sabes qué le falta a ${N[2]}, así que echa una carta que no vale nada: el <b>7 de copas</b>.`, `Has guanyat la basa, així que ixes tu.<br><b>Consell:</b> en eixir, interessa anar-se'n d'un pal que la teua parella <b>no tinga</b>, perquè així podrà matar amb triomf. Encara no saps què li falta a ${N[2]}, així que tira una carta que no val res: el <b>7 de copes</b>.`)
    : L('Juegan los demás…', 'Juguen els altres…');
  if (k === 3) return me ? L(`${N[1]} ha salido con el <b>3 de bastos</b> (10 puntos), ${N[2]} ha echado el <b>5 de oros</b>, que es triunfo, y ${N[3]} el 7 de bastos. La baza va para tu pareja.<br>Es la <b>última baza con montón</b> y eres el último en echar. Cuando la baza es de tu pareja, <b>cárgale</b> puntos: echa el <b>3 de espadas</b> (10 puntos).`, `${N[1]} ha eixit amb el <b>3 de bastos</b> (10 punts), ${N[2]} ha tirat el <b>5 d'oros</b>, que és triomf, i ${N[3]} el 7 de bastos. La basa va per a la teua parella.<br>És l'<b>última basa amb munt</b> i eres l'últim a tirar. Quan la basa és de la teua parella, <b>carrega-li</b> punts: tira el <b>3 d'espases</b> (10 punts).`)
    : L('Juegan los demás…', 'Juguen els altres…');
  if (k === 4) return me ? L(`<b>Arrastre:</b> hay que <b>seguir el palo</b> y <b>superar al rival</b> si se puede. ${N[3]} gana con el caballo de espadas: solo puedes echar el <b>rey</b> o la <b>sota de espadas</b> (las demás salen apagadas). Elige una.`, `<b>Arrossegament:</b> cal <b>seguir el pal</b> i <b>superar el rival</b> si es pot. ${N[3]} guanya amb el cavall d'espases: només pots tirar el <b>rei</b> o la <b>sota d'espases</b> (les altres ixen apagades). Tria'n una.`)
    : L('Juegan los demás…', 'Juguen els altres…');
  return me ? L('Ahora sigue tú solo. Recuerda: seguir el palo, superar al rival si se puede y, si gana tu pareja, cualquier carta del palo. <b>Las 10 de últimas</b> son para quien gane la última baza.', 'Ara continua tu sol. Recorda: seguir el pal, superar el rival si es pot i, si guanya la teua parella, qualsevol carta del pal. <b>Les 10 d\'últimes</b> són per a qui guanye l\'última basa.')
    : L('Juegan los demás… Fíjate en qué triunfos van saliendo.', 'Juguen els altres… Fixa\'t en quins triomfs van eixint.');
}

    const a = f.animate([{ transform: `translate(${ox - w}px,${oy - h}px) scale(.75)` }, { transform: `translate(${to[0] - w}px,${to[1] - h}px) scale(1)` }], { duration: DEAL_MS, easing: 'cubic-bezier(.3,.7,.3,1)' });

  render();

    const anims = [];
    $('hand').querySelectorAll('.hc').forEach(b => { const dx = (before[b.dataset.id] ?? 0) - bcr(b).left; if (Math.abs(dx) > 1) anims.push(b.animate([{ transform: `translate(${dx}px,-14px)` }, { transform: 'translate(0,-14px)', offset: .75 }, { transform: 'translate(0,0)' }], { duration: 520 * SPEEDS[speedIx][1], easing: 'cubic-bezier(.3,.7,.3,1)' }).finished.catch(() => {})); });
    await Promise.all(anims);
